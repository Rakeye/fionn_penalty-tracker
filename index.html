<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Fionn's Game Time Tracker</title>
<style>
  :root{--bg:#0f1115;--card:#1a1d24;--ink:#fff;--muted:#9aa3b2;--red:#ff3b3b;--green:#22e07a;--line:#2a2f3a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:520px;margin:0 auto;padding:14px 14px 40px}
  .title{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:1.05rem;color:var(--muted);margin:4px 2px 12px}
  .hero{border-radius:24px;padding:18px 12px 20px;text-align:center;margin-bottom:12px;background:#2a0f0f;border:3px solid var(--red)}
  .hero .icon{font-size:2.2rem}
  .hero .num{font-size:clamp(6.5rem,36vw,11rem);font-weight:900;line-height:.88;color:var(--red);font-variant-numeric:tabular-nums;letter-spacing:-.04em;white-space:nowrap}
  .hero.timing .num{font-size:clamp(4.2rem,20vw,8rem)}
  .hero .unit{font-size:1.5rem;font-weight:800;color:var(--red);letter-spacing:.04em}
  .hero .sub{margin-top:6px;font-size:1.05rem;font-weight:700;color:var(--muted)}
  button{font:inherit;border:0;border-radius:18px;min-height:56px;min-width:56px;cursor:pointer;font-weight:800;color:#fff}
  button:active{transform:scale(.97)}
  .bigbtn{width:100%;min-height:84px;font-size:1.8rem;margin-bottom:12px}
  .red{background:var(--red)} .green{background:var(--green);color:#06210f} .grey{background:#2d323d}
  .row{display:flex;gap:10px;margin-bottom:12px}
  .row>*{flex:1}
  .row .bigbtn{margin-bottom:0;font-size:1.35rem;padding:0 8px}
  input{font:inherit;width:100%;min-height:56px;padding:0 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:#fff;font-size:1.1rem;margin-bottom:10px}
  details{background:var(--card);border-radius:22px;padding:4px 14px;margin-bottom:12px}
  summary{min-height:56px;display:flex;align-items:center;font-weight:800;font-size:1.1rem;cursor:pointer;list-style:none}
  summary::-webkit-details-marker{display:none}
  ul{list-style:none;padding:0;margin:0 0 8px}
  li{padding:10px 0;border-top:1px solid var(--line);font-size:1rem;overflow-wrap:anywhere}
  .meta{color:var(--muted);font-size:.85rem}
  .used{opacity:.55}
  .over{position:fixed;inset:0;background:var(--red);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:20;padding:24px}
  .over.on{display:flex}
  .over .big{font-size:clamp(1.9rem,8vw,3.1rem);font-weight:900;line-height:1.08;color:#fff;max-width:14em}
  .over button{margin-top:28px;background:#fff;color:#b00;min-height:72px;font-size:1.5rem;padding:0 32px}
  .snd{background:#2d323d;min-height:48px;min-width:48px;font-size:1.3rem;border-radius:14px}
</style>
</head>
<body>
<div class="over" id="over"><div class="big" id="overMsg">⏰ Penalty done — add 5 min on parental controls</div><button id="doneBtn">✓ DONE</button></div>
<div class="wrap">
  <div class="title"><span>⚠️ Fionn's Penalties</span><button class="snd" id="sndBtn" aria-label="Sound on or off">🔇</button></div>

  <div class="hero" id="hero">
    <div class="icon" id="heroIcon">👍</div>
    <div class="num" id="heroNum">0</div>
    <div class="unit" id="heroUnit">MIN</div>
    <div class="sub" id="heroSub">No penalties</div>
  </div>

  <input id="note" placeholder="📝 What was missed? (optional)" autocomplete="off">
  <div class="row">
    <button class="bigbtn red" id="addPen" aria-label="Add 5 minutes">➕ 5 MIN</button>
    <button class="bigbtn grey" id="subPen" aria-label="Remove 5 minutes">➖ 5 MIN</button>
  </div>
  <button class="bigbtn green" id="startBtn" style="display:none">▶ START</button>

  <details><summary>⚠️ History</summary><ul id="logList"></ul></details>
  <button class="grey" id="clearBtn" style="width:100%;min-height:64px;font-size:1.15rem">🧹 Clear to zero</button>
  <p class="meta" style="text-align:center;margin-top:14px">Saved on this device only.</p>
</div>

<script>
const KEY='fionnTracker.v3';
const STEP=5*60*1000;
const $=id=>document.getElementById(id);
const fmt=t=>new Date(t).toLocaleString([], {weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function blank(){return {sound:false,totalMs:0,mode:'idle',endsAt:null,remainingMs:0,runMs:0,servedMs:0,alerted:false,log:[]};}
function norm(o){
  const S=blank();
  if(!o||typeof o!=='object')return S;
  S.sound=!!o.sound;
  S.totalMs=Math.max(0,Number(o.totalMs)||0);
  const modes={idle:1,running:1,paused:1,done:1};
  S.mode=modes[o.mode]?o.mode:'idle';
  S.endsAt=typeof o.endsAt==='number'?o.endsAt:null;
  S.remainingMs=Math.max(0,Number(o.remainingMs)||0);
  S.runMs=Math.max(0,Number(o.runMs)||0);
  S.servedMs=Math.max(0,Number(o.servedMs)||0);
  S.alerted=!!o.alerted;
  S.log=Array.isArray(o.log)?o.log.filter(e=>e&&e.t&&e.kind).map(e=>({t:e.t,kind:e.kind,ms:Math.max(0,Number(e.ms)||0),note:e.note||''})):[];
  if(S.mode==='running'&&typeof S.endsAt!=='number')S.mode='paused';
  if(S.mode==='paused'&&S.remainingMs<=0){S.mode='idle';S.totalMs=0}
  if(S.mode==='done'&&S.servedMs<=0)S.servedMs=S.runMs||STEP;
  return S;
}
function fromOld(o){
  const S=blank();
  S.sound=!!(o&&o.sound);
  const pens=(o&&Array.isArray(o.penalties))?o.penalties:[];
  pens.forEach(p=>{
    if(p.status==='complete'||p.applied===true){
      S.log.push({t:p.completedAt||p.t||Date.now(),kind:'served',ms:STEP,note:p.note||''});
      return;
    }
    let ms=STEP;
    if(p.status==='paused'&&typeof p.remainingMs==='number')ms=Math.max(0,p.remainingMs);
    else if(p.status==='running'&&typeof p.endsAt==='number'){
      const left=p.endsAt-Date.now();
      ms=left>0?left:STEP;
    }
    if(ms<=0)return;
    ms=Math.ceil(ms/60000)*60000;
    S.totalMs+=ms;
    S.log.push({t:p.t||Date.now(),kind:'add',ms,note:p.note||''});
  });
  return norm(S);
}
function readKey(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
const existing=readKey(KEY);
let S=existing?norm(existing):fromOld(readKey('fionnTracker.v2')||readKey('fionnTracker.v1'));
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
if(!existing)save();
function owed(){
  if(S.mode==='running'&&typeof S.endsAt==='number')return Math.max(0,S.endsAt-Date.now());
  if(S.mode==='paused')return Math.max(0,S.remainingMs);
  if(S.mode==='done')return 0;
  return Math.max(0,S.totalMs);
}
function clock(ms){
  const sec=Math.max(0,Math.ceil(ms/1000));
  return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
}
function minsLabel(ms){
  const whole=Math.round(ms/60000);
  if(Math.abs(ms-whole*60000)<1500)return whole+' min';
  const sec=Math.max(0,Math.round(ms/1000));
  return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
}
function pushLog(e){S.log.push(e);if(S.log.length>400)S.log.splice(0,S.log.length-400)}
function paintHero(){
  const timing=S.mode==='running'||S.mode==='paused';
  $('hero').classList.toggle('timing',timing);
  if(timing){
    const left=S.mode==='running'?Math.max(0,S.endsAt-Date.now()):Math.max(0,S.remainingMs);
    $('heroIcon').textContent=S.mode==='paused'?'⏸':'⏱️';
    $('heroNum').textContent=clock(left);
    $('heroUnit').textContent=S.mode==='paused'?'PAUSED':'LEFT';
    $('heroSub').textContent='';
    return;
  }
  const m=Math.max(0,Math.round(S.totalMs/60000));
  $('heroIcon').textContent=m?'⚠️':'👍';
  $('heroNum').textContent=String(m);
  $('heroUnit').textContent='MIN';
  $('heroSub').textContent=m?'Penalty time':'No penalties';
}
function logLine(e){
  let label='';
  if(e.kind==='add')label='➕ '+minsLabel(e.ms);
  else if(e.kind==='remove')label='➖ '+minsLabel(e.ms);
  else if(e.kind==='served')label='✓ Served '+minsLabel(e.ms);
  else if(e.kind==='clear')label='🧹 Cleared '+minsLabel(e.ms);
  else return '';
  const note=e.note?' · '+esc(e.note):'';
  const dim=e.kind==='served'||e.kind==='clear'?' class="used"':'';
  return `<li${dim}>${label}${note}<div class="meta">${fmt(e.t)}</div></li>`;
}
function render(){
  paintHero();
  const start=$('startBtn');
  const showStart=S.mode==='running'||S.mode==='paused'||(S.mode==='idle'&&S.totalMs>0);
  start.style.display=showStart?'block':'none';
  if(S.mode==='running'){start.textContent='⏸ PAUSE';start.className='bigbtn grey'}
  else{start.textContent='▶ START';start.className='bigbtn green'}
  const done=S.mode==='done';
  $('over').classList.toggle('on',done);
  if(done){
    const m=Math.max(1,Math.round(S.servedMs/60000));
    $('overMsg').textContent=`⏰ Penalty done — add ${m} min on parental controls`;
  }
  const lines=S.log.slice().reverse().map(logLine).filter(Boolean).join('');
  $('logList').innerHTML=lines||'<li class="meta">None yet 👍</li>';
}
function finishRun(){
  if(S.mode==='done')return false;
  S.servedMs=S.runMs||S.totalMs||owed();
  S.mode='done';
  S.totalMs=0;
  S.remainingMs=0;
  S.endsAt=null;
  const first=!S.alerted;
  S.alerted=true;
  return first;
}
function catchUp(){
  if(S.mode==='running'&&typeof S.endsAt==='number'&&Date.now()>=S.endsAt){
    const alert=finishRun();
    save();render();
    if(alert)alertCue(3);
    return true;
  }
  if(S.mode==='done'&&!S.alerted){
    S.alerted=true;save();render();alertCue(3);return true;
  }
  return false;
}
function tick(){
  if(catchUp())return;
  if(S.mode==='running')paintHero();
}
function addFive(){
  if(catchUp())return;
  const note=$('note').value.trim();
  $('note').value='';
  if(S.mode==='running'){
    S.endsAt+=STEP;
    S.runMs=(S.runMs||0)+STEP;
    S.totalMs=Math.max(0,S.endsAt-Date.now());
  }else if(S.mode==='paused'){
    S.remainingMs+=STEP;
    S.totalMs=S.remainingMs;
    S.runMs=(S.runMs||0)+STEP;
  }else{
    S.mode='idle';
    S.totalMs+=STEP;
  }
  pushLog({t:Date.now(),kind:'add',ms:STEP,note});
  save();render();
  if(navigator.vibrate)navigator.vibrate(80);
}
function subFive(){
  if(catchUp())return;
  const have=owed();
  if(have<=0)return;
  const cut=Math.min(STEP,have);
  if(S.mode==='running'){
    S.endsAt-=cut;
    S.runMs=Math.max(0,(S.runMs||0)-cut);
    S.totalMs=Math.max(0,have-cut);
    if(S.totalMs<=0||S.endsAt<=Date.now()){
      S.mode='idle';S.endsAt=null;S.totalMs=0;S.remainingMs=0;S.runMs=0;S.alerted=false;
    }
  }else if(S.mode==='paused'){
    S.remainingMs=Math.max(0,S.remainingMs-cut);
    S.totalMs=S.remainingMs;
    S.runMs=Math.max(0,(S.runMs||0)-cut);
    if(S.remainingMs<=0){S.mode='idle';S.runMs=0;S.alerted=false}
  }else S.totalMs=Math.max(0,S.totalMs-cut);
  pushLog({t:Date.now(),kind:'remove',ms:cut,note:''});
  save();render();
}
function startRun(){
  if(catchUp())return;
  if(S.mode==='running'){
    const left=Math.max(0,(S.endsAt||0)-Date.now());
    if(left<=0){const alert=finishRun();save();render();if(alert)alertCue(3);return}
    S.mode='paused';
    S.remainingMs=left;
    S.totalMs=left;
    S.endsAt=null;
    save();render();
    return;
  }
  const resuming=S.mode==='paused'&&S.remainingMs>0;
  const left=resuming?S.remainingMs:S.totalMs;
  if(left<=0)return;
  if(!resuming||!(S.runMs>0))S.runMs=left;
  S.mode='running';
  S.endsAt=Date.now()+left;
  S.totalMs=left;
  S.remainingMs=left;
  S.alerted=false;
  save();render();
}
function clearAll(){
  if(S.mode==='done')return;
  const left=owed();
  if(left<=0)return;
  if(!confirm('Clear all penalty time?'))return;
  pushLog({t:Date.now(),kind:'clear',ms:left,note:''});
  S.mode='idle';
  S.totalMs=0;S.remainingMs=0;S.endsAt=null;S.runMs=0;S.servedMs=0;S.alerted=false;
  save();render();
}
function markServed(){
  if(S.mode!=='done')return;
  if(S.servedMs>0)pushLog({t:Date.now(),kind:'served',ms:S.servedMs,note:''});
  S.mode='idle';
  S.totalMs=0;S.remainingMs=0;S.endsAt=null;S.runMs=0;S.servedMs=0;S.alerted=false;
  save();render();
}
let ctx=null;
function beep(f,d,at){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;o.type='square';g.gain.setValueAtTime(.0001,ctx.currentTime+at);g.gain.exponentialRampToValueAtTime(.4,ctx.currentTime+at+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+at+d);o.connect(g).connect(ctx.destination);o.start(ctx.currentTime+at);o.stop(ctx.currentTime+at+d+.05)}
function alertCue(n){if(navigator.vibrate)navigator.vibrate(n===3?[400,200,400,200,400]:n===2?[200,100,200]:[200]);if(!S.sound||!ctx)return;try{ctx.resume();for(let i=0;i<n*2;i++)beep(n===3?520:880,.18,i*.3)}catch(e){}}
function sndLabel(){$('sndBtn').textContent=S.sound?'🔊':'🔇'}
$('addPen').onclick=addFive;
$('subPen').onclick=subFive;
$('startBtn').onclick=startRun;
$('clearBtn').onclick=clearAll;
$('doneBtn').onclick=markServed;
$('sndBtn').onclick=()=>{S.sound=!S.sound;save();sndLabel();if(S.sound){ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();beep(880,.12,0)}};
document.addEventListener('click',()=>{if(S.sound&&!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)()}},{once:true});
function onWake(){tick()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')onWake()});
window.addEventListener('pageshow',onWake);
window.addEventListener('focus',onWake);
sndLabel();
render();
tick();
setInterval(tick,250);
</script>
</body>
</html>
