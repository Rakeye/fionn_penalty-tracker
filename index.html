<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6bff">
<title>Fionn's Game Time Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Passion+One:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#fff;
    --yellow:#ffe14a;
    --yellow-deep:#f5b400;
    --storm:#b45cff;
    --epic:#9b4dff;
    --rare:#3aa0ff;
    --uncommon:#5dff4a;
    --legend:#ffb020;
    --panel:#140a32;
    --ink-dim:#d5d0ea;
    --display:"Passion One","Arial Narrow","Helvetica Neue Condensed Bold",Impact,Haettenschweiler,sans-serif;
    --timer:"Anton","Arial Narrow",Impact,Haettenschweiler,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    color:var(--ink);
    font-family:var(--display);
    background:
      repeating-linear-gradient(-18deg, transparent 0 22px, rgba(120,40,255,.13) 22px 24px),
      radial-gradient(circle at 50% -8%, rgba(255,225,74,.22), transparent 42%),
      radial-gradient(circle at 50% 8%, transparent 0 120px, rgba(180,92,255,.55) 126px 142px, transparent 150px),
      linear-gradient(180deg, #49c4ff 0%, #2f6bff 26%, #6a2bff 58%, #24105f 100%);
    background-attachment:fixed;
  }
  .storm{
    position:fixed;z-index:0;pointer-events:none;
    width:150vw;height:150vw;left:50%;top:-28vw;transform:translateX(-50%);
    border-radius:50%;
    border:16px solid rgba(176,80,255,.42);
    box-shadow:0 0 0 10px rgba(70,20,160,.28), inset 0 0 60px rgba(150,70,255,.2);
  }
  .wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:14px 14px calc(28px + env(safe-area-inset-bottom))}
  .title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 2px 12px}
  .brand{
    font-size:clamp(1.35rem,6vw,1.7rem);letter-spacing:.04em;text-transform:uppercase;line-height:1;
    color:var(--yellow);
    text-shadow:0 3px 0 #1a0a40, 0 0 12px rgba(255,225,74,.35);
  }
  .hero{
    position:relative;
    text-align:center;
    margin-bottom:14px;
    padding:16px 12px 18px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.08), transparent 28%),
      linear-gradient(180deg, #1b1464 0%, #12082e 100%);
    border:3px solid var(--yellow);
    border-radius:18px;
    box-shadow:
      0 0 0 5px rgba(110,40,200,.45),
      0 10px 0 rgba(16,4,40,.45),
      inset 0 0 36px rgba(120,60,255,.4);
  }
  .kicker{
    font-size:.95rem;letter-spacing:.18em;text-transform:uppercase;color:var(--yellow);
    text-shadow:0 2px 0 #1a0a40;
  }
  .hero .icon{font-size:1.8rem;line-height:1;margin-top:2px}
  .hero .num{
    font-family:var(--timer);
    font-size:clamp(6.2rem,34vw,10.5rem);
    font-weight:400;line-height:.84;letter-spacing:-.03em;
    color:#fff;white-space:nowrap;
    text-shadow:
      0 1px 0 #12081f, 0 4px 0 #12081f, 0 7px 0 #2a1468,
      3px 0 0 #12081f, -3px 0 0 #12081f, 0 -3px 0 #12081f,
      0 10px 18px rgba(0,0,0,.45);
  }
  .hero.timing .num{font-size:clamp(4rem,18vw,7.4rem);letter-spacing:-.02em}
  .hero .unit{
    font-size:1.55rem;letter-spacing:.16em;text-transform:uppercase;color:var(--yellow);
    text-shadow:0 3px 0 #1a0a40;
  }
  .hero .sub{margin-top:4px;min-height:1.2em;font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
  .hero.credit{
    border-color:#5dff4a;
    box-shadow:
      0 0 0 5px rgba(93,255,74,.38),
      0 10px 0 rgba(16,4,40,.45),
      inset 0 0 36px rgba(80,255,120,.28);
  }
  .hero.credit .kicker,.hero.credit .unit{color:#5dff4a}
  .hero.credit .num{
    color:#ffe14a;
    text-shadow:
      0 1px 0 #06210a, 0 4px 0 #06210a, 0 7px 0 #146828,
      3px 0 0 #06210a, -3px 0 0 #06210a, 0 -3px 0 #06210a,
      0 10px 18px rgba(0,0,0,.45);
  }
  .hero.credit .sub{color:#e7ffd4}
  .questTotal.credit{color:#5dff4a}
  button{
    font-family:inherit;border:0;cursor:pointer;color:#fff;font-weight:900;
    min-height:56px;min-width:56px;background:transparent;position:relative;
    letter-spacing:.04em;text-transform:uppercase;
  }
  .bigbtn,#clearBtn{width:100%;min-height:84px;font-size:1.7rem;margin-bottom:12px;padding:0 12px 8px;position:relative;z-index:0}
  #clearBtn{min-height:64px;font-size:1.2rem;letter-spacing:.08em}
  .bigbtn::before,#clearBtn::before{
    content:"";position:absolute;z-index:-1;left:0;right:0;top:0;bottom:8px;
    clip-path:polygon(7% 0,100% 0,93% 100%,0 100%);
    transition:transform .08s ease;
  }
  .bigbtn:active::before,#clearBtn:active::before{transform:translateY(5px)}
  .face{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.9;pointer-events:none}
  .face b{font-size:1.85rem;font-weight:900}
  .face small{font-size:clamp(.78rem,3.2vw,1rem);letter-spacing:.08em;margin-top:2px}
  #addPen{color:#fff}
  #addPen::before{background:linear-gradient(180deg,#ff5d8a 0%,#e2185a 48%,#7a2bff 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
  #subPen{color:#06210a}
  #subPen::before{background:linear-gradient(180deg,#d6ff6a 0%,#5dff4a 42%,#1fae32 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.55)}
  #startBtn.green{color:#1a1200}
  #startBtn.green::before{background:linear-gradient(180deg,#fff6a0 0%,#ffe14a 46%,#f5b400 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.7)}
  #startBtn.grey{color:#fff}
  #startBtn.grey::before{background:linear-gradient(180deg,#8d5cff 0%,#6428e0 52%,#3a12a4 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
  .row{display:flex;gap:10px;margin-bottom:12px}
  .row>*{flex:1;min-width:0}
  .row .bigbtn{margin-bottom:0}
  input{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    width:100%;min-height:56px;padding:0 12px;margin-bottom:10px;
    border-radius:14px;border:3px solid #7d5cff;
    background:rgba(10,6,28,.78);color:#fff;font-size:16px;font-weight:700;
  }
  input::placeholder{color:#c8c0e4}
  input:focus{outline:none;border-color:var(--yellow)}
  details{
    background:rgba(10,6,28,.78);
    border:3px solid rgba(255,225,74,.7);
    border-radius:16px;padding:4px 12px;margin-bottom:12px;
    box-shadow:0 6px 0 rgba(16,4,40,.35);
  }
  summary{
    min-height:56px;display:flex;align-items:center;
    font-size:1.25rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;list-style:none;color:var(--yellow);
  }
  summary::-webkit-details-marker{display:none}
  ul{list-style:none;padding:0;margin:0 0 8px}
  li.loot{
    position:relative;
    margin:0 0 8px;padding:12px 12px 10px 16px;
    background:linear-gradient(180deg, rgba(255,255,255,.1), rgba(0,0,0,.28));
    border:2px solid rgba(255,255,255,.16);
    border-radius:10px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:1rem;font-weight:800;letter-spacing:0;text-transform:none;
    overflow-wrap:anywhere;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);
  }
  li.loot::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:8px;border-radius:8px 0 0 8px;
    background:var(--rarity,#b1b1b1);
  }
  li.loot-add{--rarity:#ff3b6b}
  li.loot-remove{--rarity:#5dff4a}
  li.loot-served{--rarity:#ffb020}
  li.loot-clear{--rarity:#3aa0ff}
  li.meta{
    border:0;background:none;box-shadow:none;padding:8px 4px;
    color:var(--ink-dim);font-weight:700;
  }
  li.meta::before{display:none}
  .meta{color:#c8c0e4;font-size:.85rem;font-weight:700;margin-top:2px}
  .used{opacity:.8}
  #clearBtn{color:#fff}
  #clearBtn::before{background:linear-gradient(180deg,#6e63ff 0%,#3a2ad4 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.3)}
  .fine{position:relative;z-index:1;text-align:center;margin-top:14px;color:#efeaff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:.85rem;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.45)}
  .snd{
    min-height:52px;min-width:52px;font-size:1.35rem;border-radius:14px;
    background:#1a0d3d;border:3px solid var(--yellow);
    box-shadow:0 4px 0 #12081f;text-transform:none;
  }
  .snd:active{transform:translateY(3px);box-shadow:0 1px 0 #12081f}
  .tabs{display:flex;gap:8px;margin:0 0 12px}
  .tab{flex:1;min-height:58px;font-size:clamp(.92rem,3.5vw,1.15rem);letter-spacing:.05em;color:#fff;padding:0 8px 6px;position:relative;z-index:0}
  .tab::before{content:"";position:absolute;z-index:-1;left:0;right:0;top:0;bottom:6px;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);background:linear-gradient(180deg,#6a48d0,#2c146e);box-shadow:inset 0 2px 0 rgba(255,255,255,.25)}
  .tab.on{color:#1a1200}
  .tab.on::before{background:linear-gradient(180deg,#fff6a0,#ffe14a 50%,#f5b400);box-shadow:inset 0 2px 0 rgba(255,255,255,.7)}
  .tab:active::before{transform:translateY(3px)}
  .questLead{margin:0 0 8px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:1rem;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .questTotal{margin:0 0 12px;color:var(--yellow);letter-spacing:.08em;text-transform:uppercase;font-size:1.15rem;text-shadow:0 2px 0 #1a0a40}
  .qcard{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(0,0,0,.3));border:3px solid rgba(255,225,74,.75);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 6px 0 rgba(16,4,40,.35)}
  .qname{font-size:1.28rem;letter-spacing:.03em;text-transform:uppercase;line-height:1.05;margin-bottom:8px}
  .qrow{display:flex;gap:8px}
  .slab{position:relative;z-index:0;min-height:56px;padding:0 10px 6px}
  .slab::before{content:"";position:absolute;z-index:-1;left:0;right:0;top:0;bottom:6px;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%)}
  .slab:active::before{transform:translateY(4px)}
  .claim{flex:1;color:#06210a;font-size:1.25rem}
  .claim::before{background:linear-gradient(180deg,#d6ff6a,#5dff4a 45%,#1fae32);box-shadow:inset 0 2px 0 rgba(255,255,255,.55)}
  .del{min-width:96px;color:#fff;font-size:1rem}
  .del::before{background:linear-gradient(180deg,#8d5cff,#3a12a4);box-shadow:inset 0 2px 0 rgba(255,255,255,.3)}
  .qempty{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#efeaff;font-weight:700}
  #addQuest{color:#fff}
  #addQuest::before{background:linear-gradient(180deg,#7ec8ff,#2f6bff 55%,#3a2ad4);box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
  #spinBtn{color:#1a1200}
  #spinBtn::before{background:linear-gradient(180deg,#fff6a0,#ffe14a 46%,#f5b400);box-shadow:inset 0 2px 0 rgba(255,255,255,.7)}
  .wheelbox{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;background:radial-gradient(circle at 50% 18%,rgba(255,225,74,.18),transparent 36%),linear-gradient(180deg,rgba(18,8,48,.94),rgba(8,4,24,.96))}
  .wheelbox.on{display:flex}
  .wheel-stage{position:relative;width:min(86vw,340px);aspect-ratio:1}
  .ptr{position:absolute;left:50%;top:-2px;transform:translateX(-50%);z-index:3;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:28px solid var(--yellow);filter:drop-shadow(0 3px 0 #1a0a40)}
  .wheel{width:100%;height:100%;border-radius:50%;border:6px solid var(--yellow);position:relative;box-shadow:0 0 0 6px rgba(110,40,200,.5),0 12px 0 rgba(16,4,40,.45)}
  .wlab{position:absolute;left:50%;top:0;width:74px;margin-left:-37px;height:50%;transform-origin:center bottom;transform:rotate(var(--a));display:flex;justify-content:center;padding-top:16px;font-family:var(--timer);font-size:.95rem;letter-spacing:.02em;text-shadow:0 1px 0 rgba(255,255,255,.35);pointer-events:none}
  .wlab.tiny{width:40px;margin-left:-20px;font-size:.62rem;padding-top:10px}
  .hub{position:absolute;left:50%;top:50%;width:58px;height:58px;transform:translate(-50%,-50%);border-radius:50%;z-index:2;background:radial-gradient(circle at 35% 35%,#fff6a0,#f5b400 62%,#c48a00);border:4px solid #1a0a40}
  .reveal{margin-top:12px}
  .reveal .rname{font-size:2rem;letter-spacing:.1em;line-height:.9;text-shadow:0 4px 0 #1a0a40}
  .reveal .rtime{font-family:var(--timer);font-size:clamp(3rem,14vw,4.6rem);line-height:.9;color:#fff;text-shadow:0 4px 0 #1a0a40,0 0 16px rgba(255,225,74,.35)}
  .reveal .rquest{margin-top:4px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:1rem;font-weight:800;color:#fff}
  .reveal.uncommon .rname{color:#5dff4a;font-size:2.2rem}
  .reveal.rare .rname{color:#3aa0ff;font-size:2.45rem}
  .reveal.epic .rname{color:#d7a2ff;font-size:2.9rem}
  .reveal.legendary .rname{color:#ffb020;font-size:3.1rem}
  .reveal.mythic .rname{font-size:3.3rem;background:linear-gradient(90deg,#ff5d8a,#ffe14a,#5dff4a,#3aa0ff,#e6b0ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #1a0a40)}
  .reveal.common .rname{color:#f4f4f8}
  .reveal.epic .rtime,.reveal.legendary .rtime,.reveal.mythic .rtime{font-size:clamp(3.5rem,16vw,5.2rem)}
  .wheelbox .partybits{display:none}
  .wheelbox.party .partybits{display:block}
  #wheelClose{margin-top:16px;min-height:64px;min-width:200px;color:#1a1200;font-size:1.35rem;padding:0 18px 6px;position:relative;z-index:0}
  #wheelClose::before{content:"";position:absolute;z-index:-1;left:0;right:0;top:0;bottom:6px;clip-path:polygon(6% 0,100% 0,94% 100%,0 100%);background:linear-gradient(180deg,#fff6a0,#ffe14a 50%,#f5b400)}
  li.loot-common{--rarity:#e4e4ee}
  li.loot-uncommon{--rarity:#5dff4a}
  li.loot-rare{--rarity:#3aa0ff}
  li.loot-epic{--rarity:#c06bff}
  li.loot-legendary{--rarity:#ff9a1a}
  li.loot-mythic{--rarity:#ffe14a}
  .over{
    position:fixed;inset:0;z-index:40;display:none;
    flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:24px;
    background:
      radial-gradient(circle at 50% 18%, rgba(255,225,74,.28), transparent 34%),
      repeating-linear-gradient(-18deg, transparent 0 18px, rgba(255,255,255,.05) 18px 20px),
      linear-gradient(180deg, #49c4ff 0%, #5a2bff 46%, #1a0a4a 100%);
  }
  .over.on{display:flex}
  .confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .confetti i{
    position:absolute;top:-12px;width:10px;height:16px;border-radius:2px;opacity:.9;
    animation:fall 2.8s linear infinite;
  }
  .confetti i:nth-child(1){left:8%;background:var(--yellow);animation-delay:-.2s}
  .confetti i:nth-child(2){left:18%;background:var(--uncommon);width:8px;height:8px;border-radius:50%;animation-delay:-1s}
  .confetti i:nth-child(3){left:30%;background:var(--rare);animation-delay:-1.6s}
  .confetti i:nth-child(4){left:42%;background:var(--legend);animation-delay:-.6s}
  .confetti i:nth-child(5){left:55%;background:#ff5d8a;width:8px;height:8px;border-radius:50%;animation-delay:-2s}
  .confetti i:nth-child(6){left:66%;background:var(--yellow);animation-delay:-1.2s}
  .confetti i:nth-child(7){left:76%;background:var(--storm);animation-delay:-.4s}
  .confetti i:nth-child(8){left:88%;background:var(--uncommon);width:8px;height:8px;border-radius:50%;animation-delay:-1.8s}
  @keyframes fall{to{transform:translateY(110vh) rotate(200deg)}}
  .vic{
    position:relative;z-index:1;margin:0 0 12px;
    font-size:clamp(2.7rem,13vw,4.6rem);line-height:.88;letter-spacing:.02em;text-transform:uppercase;
    color:var(--yellow);
    -webkit-text-stroke:2px #1a0a30;
    text-shadow:0 6px 0 #4a1cae, 0 0 22px rgba(255,225,74,.55);
  }
  .over .big{
    position:relative;z-index:1;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:clamp(1.25rem,5.4vw,1.7rem);font-weight:800;line-height:1.2;color:#fff;
    max-width:16em;text-transform:none;letter-spacing:0;
    text-shadow:0 2px 0 rgba(0,0,0,.4);
  }
  .over button{
    position:relative;z-index:0;margin-top:26px;min-height:72px;min-width:180px;
    padding:0 28px 8px;font-size:1.55rem;color:#1a1200;letter-spacing:.06em;
  }
  .over button::before{
    content:"";position:absolute;z-index:-1;left:0;right:0;top:0;bottom:8px;
    clip-path:polygon(6% 0,100% 0,94% 100%,0 100%);
    background:linear-gradient(180deg,#fff6a0,#ffe14a 50%,#f5b400);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.75);
  }
  .over button:active::before{transform:translateY(5px)}
  .over .flash{
    position:absolute;inset:0;z-index:6;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 42%, #fff 0%, rgba(255,225,74,.9) 26%, rgba(255,225,74,0) 68%);
  }
  .over.boom .flash{animation:vflash .62s ease-out}
  .over.boom .vic,.over.boom .big,.over.boom button{animation:vshake .75s linear}
  @keyframes vflash{0%{opacity:1}38%{opacity:.5}100%{opacity:0}}
  @keyframes vshake{
    0%,100%{transform:translate3d(0,0,0)}
    12%{transform:translate3d(-12px,8px,0)}
    24%{transform:translate3d(14px,-10px,0)}
    36%{transform:translate3d(-10px,6px,0)}
    48%{transform:translate3d(8px,-4px,0)}
    64%{transform:translate3d(-4px,2px,0)}
    80%{transform:translate3d(2px,-1px,0)}
  }
  @media (prefers-reduced-motion:reduce){
    .confetti i,.bigbtn::before,#clearBtn::before,.over button::before,.over.boom .vic,.over.boom .big,.over.boom button,.over.boom .flash{animation:none;transition:none}
  }
</style>
</head>
<body>
<div class="storm" aria-hidden="true"></div>
<div class="over" id="over">
  <div class="flash" aria-hidden="true"></div>
  <div class="confetti" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <p class="vic">Victory Royale</p>
  <div class="big" id="overMsg">⏰ Penalty done — add 5 min on parental controls</div>
  <button id="doneBtn">✓ DONE</button>
</div>
<div class="wheelbox" id="wheelBox" aria-hidden="true">
  <div class="confetti partybits" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="wheel-stage">
    <div class="ptr" aria-hidden="true"></div>
    <div class="wheel" id="wheel"></div>
    <div class="hub" aria-hidden="true"></div>
  </div>
  <div class="reveal" id="wheelReveal" hidden>
    <div class="rname" id="rName"></div>
    <div class="rtime" id="rTime"></div>
    <div class="rquest" id="rQuest"></div>
  </div>
  <button id="wheelClose" hidden>Continue</button>
</div>
<div class="wrap">
  <div class="title"><span class="brand">Fionn's Penalties</span><button class="snd" id="sndBtn" aria-label="Sound on or off">🔇</button></div>
  <div class="tabs" role="tablist">
    <button class="tab on" id="tabTimer" role="tab" aria-selected="true" aria-controls="viewTimer">Storm timer</button>
    <button class="tab" id="tabQuests" role="tab" aria-selected="false" aria-controls="viewQuests">Side quests</button>
  </div>
  <div id="viewTimer" role="tabpanel">

  <div class="hero" id="hero">
    <div class="kicker" id="heroKicker">Storm timer</div>
    <div class="icon" id="heroIcon">👍</div>
    <div class="num" id="heroNum">0</div>
    <div class="unit" id="heroUnit">MIN</div>
    <div class="sub" id="heroSub">No penalties</div>
  </div>

  <input id="note" placeholder="What was missed? (optional)" autocomplete="off">
  <div class="row">
    <button class="bigbtn red" id="addPen" aria-label="Add 5 minutes"><span class="face"><b>+5</b><small>PENALTY</small></span></button>
    <button class="bigbtn grey" id="subPen" aria-label="Remove 5 minutes"><span class="face"><b>−5</b><small>EARNED BACK</small></span></button>

  <details><summary>History</summary><ul id="logList"></ul></details>

  </div>
  <div id="viewQuests" role="tabpanel" hidden>
    <p class="questLead">Things Fionn can do to earn penalty time back.</p>
    <p class="questTotal" id="questTotal">Penalty 0 min</p>

    <div id="questList"></div>
    <input id="questName" placeholder="Add a quest" autocomplete="off" maxlength="60">
    <button class="bigbtn" id="addQuest">Add quest</button>
  </div>
  <p class="fine">Saved on this device only.</p>
</div>

<script>
const KEY='fionnTracker.v3';
const STEP=5*60*1000;
const $=id=>document.getElementById(id);
const fmt=t=>new Date(t).toLocaleString([], {weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const QUEST_NAMES=['Tidy your bedroom','Read a book for 15 minutes','Help set or clear the table','Put your laundry away','Do 20 star jumps','Draw a picture for someone','Help with the dishes','Make your bed','Feed or help with a pet','Write a thank-you or sorry note','Practise spelling or times tables','Sort your toys or Lego'];
function defaultQuests(){return QUEST_NAMES.map((name,i)=>({id:'qd'+i,name}));}
function normQuests(o){
  if(o&&Array.isArray(o.quests))return o.quests.filter(q=>q&&String(q.name||'').trim()).map((q,i)=>({id:String(q.id||('q'+i)),name:String(q.name).trim().slice(0,60)}));
  return defaultQuests();
}
function blank(){return {sound:false,totalMs:0,mode:'idle',endsAt:null,remainingMs:0,runMs:0,servedMs:0,alerted:false,log:[],quests:defaultQuests()};}
function norm(o){
  const S=blank();
  S.quests=normQuests(o);
  if(!o||typeof o!=='object')return S;
  S.sound=!!o.sound;
  const totalN=Number(o.totalMs);
  S.totalMs=Number.isFinite(totalN)?totalN:0;
  const modes={idle:1,running:1,paused:1,done:1};
  S.mode=modes[o.mode]?o.mode:'idle';
  S.endsAt=typeof o.endsAt==='number'?o.endsAt:null;
  S.remainingMs=Math.max(0,Number(o.remainingMs)||0);
  S.runMs=Math.max(0,Number(o.runMs)||0);
  S.servedMs=Math.max(0,Number(o.servedMs)||0);
  S.alerted=!!o.alerted;
  S.log=Array.isArray(o.log)?o.log.filter(e=>e&&e.t&&e.kind).map(e=>({t:e.t,kind:e.kind,ms:Math.max(0,Number(e.ms)||0),note:e.note||'',rarity:e.rarity||''})):[];
  if(S.mode==='running'&&typeof S.endsAt!=='number')S.mode='paused';
  if(S.mode==='paused'&&S.remainingMs<=0){S.mode='idle';if(S.totalMs>0)S.totalMs=0}
  if(S.mode==='done'&&S.servedMs<=0)S.servedMs=S.runMs||STEP;
  return S;
}
function fromOld(o){
  const S=blank();
  S.sound=!!(o&&o.sound);
  const pens=(o&&Array.isArray(o.penalties))?o.penalties:[];
  pens.forEach(p=>{
    if(p.status==='complete'||p.applied===true){
      S.log.push({t:p.completedAt||p.t||Date.now(),kind:'served',ms:STEP,note:p.note||''});
      return;
    }
    let ms=STEP;
    if(p.status==='paused'&&typeof p.remainingMs==='number')ms=Math.max(0,p.remainingMs);
    else if(p.status==='running'&&typeof p.endsAt==='number'){
      const left=p.endsAt-Date.now();
      ms=left>0?left:STEP;
    }
    if(ms<=0)return;
    ms=Math.ceil(ms/60000)*60000;
    S.totalMs+=ms;
    S.log.push({t:p.t||Date.now(),kind:'add',ms,note:p.note||''});
  });
  return norm(S);
}
function readKey(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
const existing=readKey(KEY);
let S=existing?norm(existing):fromOld(readKey('fionnTracker.v2')||readKey('fionnTracker.v1'));
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
if(!existing)save();
function owed(){
  if(S.mode==='running'&&typeof S.endsAt==='number')return Math.max(0,S.endsAt-Date.now());
  if(S.mode==='paused')return Math.max(0,S.remainingMs);
  if(S.mode==='done')return 0;
  return Math.max(0,S.totalMs);
}
function clock(ms){
  const sec=Math.max(0,Math.ceil(ms/1000));
  return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
}
function minsLabel(ms){
  const whole=Math.round(ms/60000);
  if(Math.abs(ms-whole*60000)<1500)return whole+' min';
  const sec=Math.max(0,Math.round(ms/1000));
  return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
}
function pushLog(e){S.log.push(e);if(S.log.length>400)S.log.splice(0,S.log.length-400)}
function prettyDur(ms){
  const n=Math.max(0,Number(ms)||0);
  if(n%60000===0)return (n/60000)+' min';
  return clock(n);
}
function creditText(ms){
  const n=Math.abs(ms);
  if(n%60000===0)return '+'+(n/60000);
  return '+'+clock(n);
}
function totalLabel(){
  if(S.mode==='running'||S.mode==='paused')return clock(owed());
  if(S.totalMs<0){
    const n=Math.abs(S.totalMs);
    return n%60000===0?creditText(S.totalMs)+' min':creditText(S.totalMs);
  }
  return prettyDur(S.totalMs);
}
function paintHero(){
  const timing=S.mode==='running'||S.mode==='paused';
  const credit=!timing&&S.totalMs<0;
  const idleClock=!timing&&!credit&&S.totalMs%60000!==0;
  const creditClock=credit&&Math.abs(S.totalMs)%60000!==0;
  $('hero').classList.toggle('timing',timing||idleClock||creditClock);
  $('hero').classList.toggle('credit',credit);
  $('heroKicker').textContent=credit?'Shield':'Storm timer';
  const qt=$('questTotal');
  if(qt){
    qt.classList.toggle('credit',credit);
    qt.textContent=(credit?'Credit ':'Penalty ')+totalLabel();
  }
  if(timing){
    const left=S.mode==='running'?Math.max(0,S.endsAt-Date.now()):Math.max(0,S.remainingMs);
    $('heroIcon').textContent=S.mode==='paused'?'⏸':'⏱️';
    $('heroNum').textContent=clock(left);
    $('heroUnit').textContent=S.mode==='paused'?'PAUSED':'LEFT';
    $('heroSub').textContent='';
    return;
  }
  if(credit){
    $('heroIcon').textContent='🛡️';
    $('heroNum').textContent=creditText(S.totalMs);
    $('heroUnit').textContent='CREDIT';
    $('heroSub').textContent='Banked time, not a penalty';
    return;
  }
  if(idleClock){
    $('heroIcon').textContent=S.totalMs?'⚠️':'👍';
    $('heroNum').textContent=clock(S.totalMs);
    $('heroUnit').textContent='TIME';
    $('heroSub').textContent='Penalty time';
    return;
  }
  const m=Math.max(0,Math.round(S.totalMs/60000));
  $('heroIcon').textContent=m?'⚠️':'👍';
  $('heroNum').textContent=String(m);
  $('heroUnit').textContent='MIN';
  $('heroSub').textContent=m?'Penalty time':'No penalties';
}
function logLine(e){
  let label='';
  if(e.kind==='add')label='➕ '+minsLabel(e.ms);
  else if(e.kind==='remove')label='➖ '+minsLabel(e.ms);
  else if(e.kind==='served')label='✓ Served '+minsLabel(e.ms);
  else if(e.kind==='clear')label='🧹 Cleared '+minsLabel(e.ms);
  else if(e.kind==='quest')label='Side quest: '+esc(e.note||'Spin the wheel')+', '+(e.rarity?esc(e.rarity)+' ':'')+'-'+clock(e.ms);
  else return '';
  const note=e.kind==='quest'?'':(e.note?' · '+esc(e.note):'');
  const used=e.kind==='served'||e.kind==='clear'?' used':'';
  const rar=e.rarity?esc(String(e.rarity).toLowerCase()):'';
  return `<li class="loot loot-${esc(e.kind)}${rar?' loot-'+rar:''}${used}">${label}${note}<div class="meta">${fmt(e.t)}</div></li>`;
}
function render(){
  paintHero();
  const start=$('startBtn');
  const showStart=S.mode==='running'||S.mode==='paused'||(S.mode==='idle'&&S.totalMs>0);
  start.style.display=showStart?'block':'none';
  start.disabled=!showStart;
  if(S.mode==='running'){start.textContent='⏸ PAUSE';start.className='bigbtn grey'}
  else{start.textContent='▶ START';start.className='bigbtn green'}
  const done=S.mode==='done';
  $('over').classList.toggle('on',done);
  if(!done)$('over').classList.remove('boom');
  if(done){
    $('overMsg').textContent=`⏰ Penalty done — add ${prettyDur(S.servedMs)} on parental controls`;
  }
  const lines=S.log.slice().reverse().map(logLine).filter(Boolean).join('');
  $('logList').innerHTML=lines||'<li class="meta">None yet 👍</li>';
  renderQuests();
}
function finishRun(){
  if(S.mode==='done')return false;
  const served=S.runMs>0?S.runMs:(S.totalMs>0?S.totalMs:owed());
  S.servedMs=Math.max(0,served||0);
  S.mode='done';
  S.totalMs=0;
  S.remainingMs=0;
  S.endsAt=null;
  const first=!S.alerted;
  S.alerted=true;
  return first;
}
function catchUp(){
  if(spinning)return false;
  if(S.mode==='running'&&typeof S.endsAt==='number'&&Date.now()>=S.endsAt){
    const alert=finishRun();
    save();render();
    if(alert)alertCue(3);
    return true;
  }
  if(S.mode==='done'&&!S.alerted){
    S.alerted=true;save();render();alertCue(3);return true;
  }
  return false;
}
function tick(){
  if(catchUp())return;
  if(S.mode==='running')paintHero();
}
function addFive(){
  if(catchUp())return;
  const note=$('note').value.trim();
  $('note').value='';
  if(S.mode==='running'){
    S.endsAt+=STEP;
    S.runMs=(S.runMs||0)+STEP;
    S.totalMs=Math.max(0,S.endsAt-Date.now());
  }else if(S.mode==='paused'){
    S.remainingMs+=STEP;
    S.totalMs=S.remainingMs;
    S.runMs=(S.runMs||0)+STEP;
  }else{
    S.mode='idle';
    S.totalMs+=STEP;
  }
  pushLog({t:Date.now(),kind:'add',ms:STEP,note});
  save();render();
  if(navigator.vibrate)navigator.vibrate(80);
}
function reduceOwed(ms){
  const have=owed();
  if(have<=0||ms<=0)return 0;
  const cut=Math.min(ms,have);
  if(S.mode==='running'){
    S.endsAt-=cut;
    S.runMs=Math.max(0,(S.runMs||0)-cut);
    S.totalMs=Math.max(0,have-cut);
    if(S.totalMs<=0||S.endsAt<=Date.now()){
      S.mode='idle';S.endsAt=null;S.totalMs=0;S.remainingMs=0;S.runMs=0;S.alerted=false;
    }
  }else if(S.mode==='paused'){
    S.remainingMs=Math.max(0,S.remainingMs-cut);
    S.totalMs=S.remainingMs;
    S.runMs=Math.max(0,(S.runMs||0)-cut);
    if(S.remainingMs<=0){S.mode='idle';S.runMs=0;S.alerted=false;S.totalMs=0}
  }else S.totalMs=Math.max(0,S.totalMs-cut);
  return cut;
}
function applyReward(ms){
  if(!(ms>0)||S.mode==='done')return 0;
  if(S.mode==='running'){
    const have=Math.max(0,S.endsAt-Date.now());
    const next=have-ms;
    if(next>0){
      S.endsAt-=ms;
      S.runMs=Math.max(0,(S.runMs||0)-ms);
      S.totalMs=next;
      return ms;
    }
    S.mode='idle';S.endsAt=null;S.remainingMs=0;S.runMs=0;S.alerted=false;
    S.totalMs=next;
    return ms;
  }
  if(S.mode==='paused'){
    const have=Math.max(0,S.remainingMs);
    const next=have-ms;
    if(next>0){
      S.remainingMs=next;
      S.totalMs=next;
      S.runMs=Math.max(0,(S.runMs||0)-ms);
      return ms;
    }
    S.mode='idle';S.remainingMs=0;S.runMs=0;S.alerted=false;
    S.totalMs=next;
    return ms;
  }
  S.mode='idle';
  S.totalMs-=ms;
  return ms;
}
function subFive(){
  if(catchUp())return;
  const cut=reduceOwed(STEP);
  if(cut<=0)return;
  pushLog({t:Date.now(),kind:'remove',ms:cut,note:''});
  save();render();
}
function startRun(){
  if(catchUp())return;
  if(S.mode==='running'){
    const left=Math.max(0,(S.endsAt||0)-Date.now());
    if(left<=0){const alert=finishRun();save();render();if(alert)alertCue(3);return}
    S.mode='paused';
    S.remainingMs=left;
    S.totalMs=left;
    S.endsAt=null;
    save();render();
    return;
  }
  const resuming=S.mode==='paused'&&S.remainingMs>0;
  const left=resuming?S.remainingMs:S.totalMs;
  if(left<=0)return;
  if(!resuming||!(S.runMs>0))S.runMs=left;
  S.mode='running';
  S.endsAt=Date.now()+left;
  S.totalMs=left;
  S.remainingMs=left;
  S.alerted=false;
  victoryPlayed=false;
  save();render();
}
function clearAll(){
  if(S.mode==='done')return;
  const credit=S.mode!=='running'&&S.mode!=='paused'&&S.totalMs<0;
  const left=credit?S.totalMs:owed();
  if(!credit&&left<=0)return;
  if(credit&&left===0)return;
  if(!confirm(credit?'Clear banked time?':'Clear all penalty time?'))return;
  pushLog({t:Date.now(),kind:'clear',ms:Math.abs(left),note:''});
  S.mode='idle';
  S.totalMs=0;S.remainingMs=0;S.endsAt=null;S.runMs=0;S.servedMs=0;S.alerted=false;
  save();render();
}
function markServed(){
  if(S.mode!=='done')return;
  if(S.servedMs>0)pushLog({t:Date.now(),kind:'served',ms:S.servedMs,note:''});
  S.mode='idle';
  S.totalMs=0;S.remainingMs=0;S.endsAt=null;S.runMs=0;S.servedMs=0;S.alerted=false;
  save();render();
}
let ctx=null,master=null,victoryPlayed=false;
function unlockAudio(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  try{
    ctx=ctx||new AC();
    if(ctx.state==='suspended')ctx.resume();
    const buf=ctx.createBuffer(1,1,ctx.sampleRate||22050);
    const src=ctx.createBufferSource();
    src.buffer=buf;
    src.connect(ctx.destination);
    src.start(0);
  }catch(e){}
}
function ensureRack(){
  if(!ctx||master)return;
  master=ctx.createGain();
  master.gain.value=0.92;
  const comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-12;
  comp.knee.value=10;
  comp.ratio.value=5;
  comp.attack.value=0.004;
  comp.release.value=0.22;
  const len=Math.floor(ctx.sampleRate*2.4);
  const impulse=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let c=0;c<2;c++){
    const d=impulse.getChannelData(c);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5);
  }
  const reverb=ctx.createConvolver();
  reverb.buffer=impulse;
  const revGain=ctx.createGain();
  revGain.gain.value=0.38;
  const delay=ctx.createDelay(1.2);
  delay.delayTime.value=0.23;
  const fb=ctx.createGain();
  fb.gain.value=0.36;
  const damp=ctx.createBiquadFilter();
  damp.type='lowpass';
  damp.frequency.value=2400;
  const delayGain=ctx.createGain();
  delayGain.gain.value=0.3;
  master.connect(comp);
  comp.connect(ctx.destination);
  master.connect(reverb);
  reverb.connect(revGain);
  revGain.connect(comp);
  master.connect(delay);
  delay.connect(damp);
  damp.connect(fb);
  fb.connect(delay);
  damp.connect(delayGain);
  delayGain.connect(comp);
}
function setAudible(on){
  if(!master||!ctx)return;
  master.gain.cancelScheduledValues(ctx.currentTime);
  master.gain.setTargetAtTime(on?0.92:0.0001,ctx.currentTime,0.03);
}
function voice(type,freq,t,dur,peak,attack){
  const o=ctx.createOscillator();
  const g=ctx.createGain();
  o.type=type;
  const a=Math.min(attack||0.02,dur*0.45);
  if(typeof freq==='number')o.frequency.setValueAtTime(freq,t);
  else{
    o.frequency.setValueAtTime(Math.max(1,freq[0]),t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1,freq[1]),t+freq[2]);
  }
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.001,peak),t+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(master);
  o.start(t);
  o.stop(t+dur+0.04);
}
function noise(t,dur,peak,freq,type){
  const n=Math.max(1,Math.floor(ctx.sampleRate*dur));
  const buf=ctx.createBuffer(1,n,ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const src=ctx.createBufferSource();
  src.buffer=buf;
  const f=ctx.createBiquadFilter();
  f.type=type||'lowpass';
  f.frequency.value=freq||400;
  const g=ctx.createGain();
  g.gain.setValueAtTime(Math.max(0.001,peak),t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f).connect(g).connect(master);
  src.start(t);
  src.stop(t+dur+0.02);
}
function siren(t,dur){
  [['sawtooth',1,0.22],['square',1.012,0.11]].forEach(([type,mul,peak])=>{
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.type=type;
    o.frequency.setValueAtTime(220*mul,t);
    o.frequency.exponentialRampToValueAtTime(660*mul,t+dur*0.34);
    o.frequency.exponentialRampToValueAtTime(310*mul,t+dur*0.6);
    o.frequency.exponentialRampToValueAtTime(1080*mul,t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(peak,t+0.07);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.14);
    o.connect(g).connect(master);
    o.start(t);
    o.stop(t+dur+0.16);
  });
}
function boom(t,peak){
  peak=peak||0.9;
  voice('sine',[150,36,0.45],t,0.8,peak,0.006);
  voice('triangle',[86,42,0.5],t,0.9,peak*0.5,0.01);
  voice('sine',46,t,0.95,peak*0.32,0.012);
  noise(t,0.32,peak*0.5,200,'lowpass');
}
function brass(freq,t,dur,peak){
  voice('sawtooth',freq,t,dur,peak*0.34,0.04);
  voice('triangle',freq*1.004,t,dur,peak*0.28,0.03);
  voice('square',freq*0.5,t,dur*0.95,peak*0.16,0.02);
}
function chord(freqs,t,dur,peak){
  freqs.forEach((f,i)=>brass(f,t,dur,peak*(1-i*0.08)));
}
function victoryFanfare(){
  if(!S.sound||!ctx)return;
  ensureRack();
  setAudible(true);
  const t=ctx.currentTime+0.04;
  siren(t,1.4);
  boom(t+1.28,1);
  chord([261.63,329.63,392],t+1.72,0.55,0.55);
  brass(523.25,t+1.74,0.26,0.34);
  brass(659.25,t+2.0,0.26,0.34);
  chord([349.23,440,523.25],t+2.38,0.55,0.58);
  brass(698.46,t+2.42,0.28,0.32);
  chord([392,493.88,587.33],t+3.02,0.55,0.62);
  brass(783.99,t+3.06,0.3,0.36);
  chord([261.63,329.63,392,523.25],t+3.62,1.85,0.72);
  brass(523.25,t+3.68,0.24,0.32);
  brass(659.25,t+3.94,0.24,0.34);
  brass(783.99,t+4.2,0.28,0.38);
  brass(1046.5,t+4.5,1.2,0.44);
  noise(t+4.5,0.18,0.1,4200,'highpass');
}
function victoryPulse(){
  const over=$('over');
  over.classList.remove('boom');
  void over.offsetWidth;
  over.classList.add('boom');
}
function alertCue(n){
  if(n!==3){
    if(navigator.vibrate)navigator.vibrate([180]);
    return;
  }
  victoryPulse();
  if(navigator.vibrate)navigator.vibrate([90,40,90,40,240,70,70,30,70,30,70,30,150,50,320]);
  victoryPlayed=false;
  try{
    if(S.sound&&ctx&&ctx.state==='running'){
      victoryFanfare();
      victoryPlayed=true;
    }
  }catch(e){}
}
function confirmBlip(){
  if(!S.sound||!ctx)return;
  try{
    ensureRack();
    setAudible(true);
    const t=ctx.currentTime+0.02;
    voice('triangle',660,t,0.1,0.2,0.008);
    voice('triangle',880,t+0.09,0.14,0.18,0.008);
  }catch(e){}
}
function sndLabel(){$('sndBtn').textContent=S.sound?'🔊':'🔇'}
const PRIZES=[
  {name:'COMMON',ms:30000,w:50,color:'#e4e4ee',ink:'#1a1200'},
  {name:'UNCOMMON',ms:60000,w:25,color:'#5dff4a',ink:'#06210a'},
  {name:'RARE',ms:120000,w:13,color:'#3aa0ff',ink:'#041018'},
  {name:'EPIC',ms:180000,w:7,color:'#c06bff',ink:'#fff'},
  {name:'LEGENDARY',ms:240000,w:4,color:'#ff9a1a',ink:'#1a1200'},
  {name:'MYTHIC',ms:300000,w:1,color:'#ffe14a',ink:'#1a1200'}
];
let wheelRot=0,spinning=false,spinGen=0,cueTimers=[];
function prizeLayout(){
  let acc=0;
  return PRIZES.map(p=>{
    const sweep=p.w/100*360;
    const row={p,sweep,start:acc,center:acc+sweep/2};
    acc+=sweep;
    return row;
  });
}
function buildWheel(){
  const wheel=$('wheel');
  if(wheel.dataset.built)return;
  wheel.dataset.built='1';
  const parts=[];
  prizeLayout().forEach(({p,sweep,start,center})=>{
    parts.push(p.color+' '+start+'deg '+(start+sweep)+'deg');
    const lab=document.createElement('span');
    lab.className='wlab'+(p.w<8?' tiny':'');
    lab.style.setProperty('--a',center+'deg');
    lab.style.color=p.ink;
    lab.textContent=clock(p.ms);
    wheel.appendChild(lab);
  });
  wheel.style.background='conic-gradient('+parts.join(',')+')';
}
function pickPrize(){
  let r=Math.random()*100;
  for(const p of PRIZES){if(r<p.w)return p;r-=p.w}
  return PRIZES[0];
}
function renderQuests(){
  const list=$('questList');
  if(!S.quests.length)list.innerHTML='<p class="qempty">No quests yet. Add one below.</p>';
  else list.innerHTML=S.quests.map(q=>`<article class="qcard" data-qid="${esc(q.id)}"><div class="qname">${esc(q.name)}</div><div class="qrow"><button class="slab claim" data-claim>Claim</button><button class="slab del" data-del aria-label="Remove ${esc(q.name)}">Remove</button></div></article>`).join('');
}
function showTab(which){
  const quests=which==='quests';
  $('viewTimer').hidden=quests;
  $('viewQuests').hidden=!quests;
  $('tabTimer').classList.toggle('on',!quests);
  $('tabQuests').classList.toggle('on',quests);
  $('tabTimer').setAttribute('aria-selected',String(!quests));
  $('tabQuests').setAttribute('aria-selected',String(quests));
}
function armAudio(){
  unlockAudio();
  if(!S.sound||!ctx)return;
  try{ctx.resume();ensureRack()}catch(e){}
}
function clearCues(){cueTimers.forEach(clearTimeout);cueTimers=[]}
function wheelTick(i,last){
  if(!S.sound||!ctx)return;
  try{
    ensureRack();
    const t=ctx.currentTime;
    noise(t,last?0.05:0.02,last?0.28:0.16,last?900:2200,'highpass');
    voice('square',last?180:720+i*35,t,last?0.07:0.028,last?0.22:0.11,0.002);
  }catch(e){}
}
function raritySting(prize){
  if(!S.sound||!ctx)return;
  try{
    ctx.resume();
    ensureRack();
    const t=ctx.currentTime+0.02;
    const name=prize.name;
    if(name==='COMMON'){
      voice('triangle',523.25,t,0.16,0.18,0.008);
      voice('sine',659.25,t+0.12,0.22,0.16,0.008);
    }else if(name==='UNCOMMON'){
      [523.25,659.25,783.99].forEach((f,i)=>voice('triangle',f,t+i*0.1,0.2,0.22,0.01));
      voice('sine',1046.5,t+0.32,0.28,0.16,0.01);
    }else if(name==='RARE'){
      chord([523.25,659.25,783.99],t,0.72,0.34);
      [783.99,987.77,1174.7,1318.5].forEach((f,i)=>voice('square',f,t+0.18+i*0.12,0.24,0.13,0.008));
    }else if(name==='EPIC'){
      boom(t,0.55);
      chord([392,493.88,587.33,783.99],t+0.06,0.75,0.42);
      [587.33,783.99,987.77,1174.7,1568].forEach((f,i)=>voice('sawtooth',f,t+0.08+i*0.09,0.18,0.13,0.012));
    }else if(name==='LEGENDARY'){
      boom(t,0.75);
      chord([349.23,440,523.25,698.46],t+0.12,0.55,0.46);
      chord([523.25,659.25,783.99,1046.5],t+0.72,1.05,0.55);
      [783.99,1046.5,1318.5,1568].forEach((f,i)=>voice('square',f,t+0.18+i*0.11,0.18,0.14,0.008));
    }else{
      siren(t,0.42);
      boom(t+0.32,0.95);
      chord([523.25,659.25,783.99,1046.5],t+0.5,0.6,0.55);
      chord([587.33,739.99,880,1174.7],t+1.15,0.7,0.6);
      chord([523.25,659.25,783.99,1046.5,1318.5],t+1.9,1.35,0.68);
      [1318.5,1568,2093].forEach((f,i)=>voice('triangle',f,t+2.05+i*0.1,0.45,0.16,0.01));
    }
  }catch(e){}
}
function showReveal(prize,questName,cut){
  const box=$('wheelReveal');
  box.hidden=false;
  box.className='reveal '+prize.name.toLowerCase();
  $('rName').textContent=prize.name;
  $('rTime').textContent='-'+clock(prize.ms);
  let extra=questName;
  if(cut<prize.ms)extra+=cut>0?' · took off '+clock(cut):' · nothing left to take off';
  $('rQuest').textContent=extra;
  $('wheelClose').hidden=false;
  $('wheelBox').classList.toggle('party',prize.w<=7);
}
function openSpin(questName){
  if(spinning||S.mode==='done')return;
  if(catchUp())return;
  spinning=true;
  armAudio();
  buildWheel();
  const prize=pickPrize();
  const seg=prizeLayout().find(x=>x.p===prize);
  const jitter=(Math.random()-.5)*seg.sweep*.5;
  const target=(seg.center+jitter+360)%360;
  const current=((wheelRot%360)+360)%360;
  const want=(360-target)%360;
  let delta=want-current;
  if(delta<0)delta+=360;
  delta+=6*360;
  wheelRot+=delta;
  const wheel=$('wheel');
  const gen=++spinGen;
  const from=wheelRot-delta;
  wheel.style.transition='none';
  wheel.style.transform='rotate('+from+'deg)';
  $('wheelBox').classList.add('on');
  $('wheelBox').classList.remove('party');
  $('wheelBox').setAttribute('aria-hidden','false');
  $('wheelReveal').hidden=true;
  $('wheelClose').hidden=true;
  const finish=()=>{
    if(gen!==spinGen||!spinning)return;
    spinning=false;
    clearCues();
    const cut=applyReward(prize.ms);
    pushLog({t:Date.now(),kind:'quest',ms:cut,note:questName,rarity:prize.name});
    save();
    render();
    showReveal(prize,questName,cut);
    raritySting(prize);
    const vib={COMMON:[35],UNCOMMON:[45,30,55],RARE:[50,30,55,30,90],EPIC:[60,35,70,35,120,40,160],LEGENDARY:[70,40,80,40,90,40,180,50,240],MYTHIC:[90,40,90,40,100,40,160,50,240,60,320]}[prize.name]||[40];
    if(navigator.vibrate)navigator.vibrate(vib);
  };
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    wheel.style.transform='rotate('+wheelRot+'deg)';
    finish();
    return;
  }
  void wheel.offsetWidth;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    if(gen!==spinGen)return;
    wheel.style.transition='transform 4.4s cubic-bezier(.12,.7,.08,1)';
    wheel.style.transform='rotate('+wheelRot+'deg)';
    clearCues();
    const ticks=[];
    for(let at=50;at<4100;){
      ticks.push(at);
      at+=at<700?55:at<1600?80:at<2500?120:at<3300?190:at<3900?280:400;
    }
    ticks.forEach((at,i)=>cueTimers.push(setTimeout(()=>wheelTick(i,i===ticks.length-1),at)));
    const backup=setTimeout(finish,4700);
    const onEnd=ev=>{
      if(ev.propertyName&&ev.propertyName!=='transform')return;
      wheel.removeEventListener('transitionend',onEnd);
      clearTimeout(backup);
      finish();
    };
    wheel.addEventListener('transitionend',onEnd);
  }));
}
$('addPen').onclick=addFive;
$('subPen').onclick=subFive;
$('startBtn').onclick=startRun;
$('clearBtn').onclick=clearAll;
$('doneBtn').onclick=markServed;
$('tabTimer').onclick=()=>showTab('timer');
$('tabQuests').onclick=()=>showTab('quests');
$('addQuest').onclick=()=>{
  const name=$('questName').value.trim();
  if(!name)return;
  S.quests.push({id:'q'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:name.slice(0,60)});
  $('questName').value='';
  save();
  renderQuests();
};
$('spinBtn').onclick=()=>openSpin('Spin the wheel');
$('questList').onclick=ev=>{
  const btn=ev.target.closest('button');
  if(!btn)return;
  const card=btn.closest('[data-qid]');
  if(!card)return;
  const q=S.quests.find(x=>x.id===card.dataset.qid);
  if(!q)return;
  if(btn.hasAttribute('data-del')){
    S.quests=S.quests.filter(x=>x.id!==q.id);
    save();
    renderQuests();
    return;
  }
  if(btn.hasAttribute('data-claim'))openSpin(q.name);
};
$('wheelClose').onclick=()=>{
  if(spinning)return;
  $('wheelBox').classList.remove('on','party');
  $('wheelBox').setAttribute('aria-hidden','true');
};
function onGesture(){
  unlockAudio();
  if(!victoryPlayed&&S.mode==='done'&&S.sound&&ctx){
    try{ctx.resume();victoryFanfare();victoryPlayed=true}catch(e){}
  }
}
document.addEventListener('pointerdown',onGesture);
document.addEventListener('touchend',onGesture);
$('sndBtn').onclick=()=>{
  S.sound=!S.sound;
  save();
  sndLabel();
  unlockAudio();
  if(!ctx)return;
  if(S.sound){
    try{ctx.resume()}catch(e){}
    if(S.mode==='done'&&!victoryPlayed){
      try{victoryFanfare();victoryPlayed=true}catch(e){}
    }else confirmBlip();
  }else setAudible(false);
};
function onWake(){tick()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')onWake()});
window.addEventListener('pageshow',onWake);
window.addEventListener('focus',onWake);
sndLabel();
render();
tick();
setInterval(tick,250);
</script>
